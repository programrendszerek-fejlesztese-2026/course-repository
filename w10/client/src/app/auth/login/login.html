<form [formGroup]="form" (ngSubmit)="login()" class="login-form" novalidate>
	<h2 class="title">Bejelentkezés</h2>

	<mat-form-field appearance="outline">
		<mat-label>Email</mat-label>
		<input matInput id="email" type="email" formControlName="email" placeholder="email@example.com" />
		<mat-error *ngIf="email?.invalid && (email?.touched || email?.dirty)">
			<span *ngIf="email?.errors?.['required']">Email megadása kötelező.</span>
			<span *ngIf="email?.errors?.['email']">Érvényes email cím szükséges.</span>
		</mat-error>
	</mat-form-field>

	<mat-form-field appearance="outline">
		<mat-label>Jelszó</mat-label>
		<input matInput id="password" [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Jelszó" />
		<button type="button" mat-icon-button matSuffix (click)="togglePasswordVisibility()" [attr.aria-label]="hide ? 'Mutasd a jelszót' : 'Rejtsd el a jelszót'">
			<mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
		</button>
		<mat-error *ngIf="password?.invalid && (password?.touched || password?.dirty)">
			<span *ngIf="password?.errors?.['required']">Jelszó megadása kötelező.</span>
		</mat-error>
	</mat-form-field>

	<div class="actions">
		<button mat-flat-button color="primary" type="submit">Bejelentkezés</button>
		<button mat-stroked-button type="button" (click)="goToRegister()">Regisztráció</button>
	</div>
</form>
