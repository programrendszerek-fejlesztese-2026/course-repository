<header class="app-header">
	<mat-toolbar class="app-header__toolbar" role="banner">
		<a mat-button routerLink="/recipes" class="app-header__brand" aria-label="Receptgyűjtemény">Receptgyűjtemény</a>

		<span class="app-header__spacer"></span>

		<nav class="app-header__nav" role="navigation" aria-label="Fő navigáció">
			<ng-container *ngIf="(isLoggedIn$ | async) === false; else loggedIn">
				<a mat-button routerLink="/recipes" class="app-header__nav-item">Receptek</a>
				<a mat-button routerLink="/auth/login" class="app-header__nav-item">Bejelentkezés</a>
				<a mat-button routerLink="/auth/register" class="app-header__nav-item">Regisztráció</a>
			</ng-container>
			<ng-template #loggedIn>
				<a mat-button routerLink="/recipes" class="app-header__nav-item">Receptek</a>
				<a *ngIf="(isAdmin$ | async)" mat-button routerLink="/admin" class="app-header__nav-item">Admin</a>
				<span class="app-header__nav-item">{{ (currentUser$ | async)?.username }}</span>
				<button mat-button (click)="logout()" class="app-header__nav-item">Kijelentkezés</button>
			</ng-template>
		</nav>
	</mat-toolbar>
</header>
